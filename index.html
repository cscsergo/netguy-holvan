<style>
:root{
  --bg:#07070b;--card:rgba(255,255,255,.06);--field:rgba(255,255,255,.08);
  --line:rgba(255,255,255,.08);--text:#f5f5f7;--mute:#8d8d98;
  --blue:#0a84ff;--violet:#5e5ce6;--orange:#ff9f0a;--green:#30d158;--red:#ff453a;
  --grad:linear-gradient(135deg,#0a84ff,#5e5ce6);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;padding-bottom:calc(110px + env(safe-area-inset-bottom))}
body::before{content:"";position:fixed;inset:-20% -20% auto -20%;height:60vh;background:radial-gradient(60% 60% at 30% 20%,rgba(10,132,255,.28),transparent 70%),radial-gradient(50% 50% at 80% 10%,rgba(255,159,10,.14),transparent 70%);pointer-events:none;z-index:-1}
input,select,textarea,button{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:default}
.wrap{max-width:680px;margin:0 auto;padding:0 18px}

/* fejléc */
header{position:sticky;top:0;z-index:5;padding:calc(10px + env(safe-area-inset-top)) 0 12px;background:linear-gradient(var(--bg) 55%,rgba(7,7,11,.85) 80%,rgba(7,7,11,0));backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.hrow{display:flex;align-items:center;justify-content:space-between}
.brand{font-size:13px;font-weight:600;letter-spacing:.6px;text-transform:uppercase;color:var(--mute)}
h1{font-size:34px;font-weight:800;letter-spacing:-.8px;margin:2px 0 0}
.avatar{width:38px;height:38px;border-radius:50%;border:0;background:var(--grad);display:grid;place-items:center;font-weight:700;font-size:15px;overflow:hidden;padding:0}
.avatar img{width:100%;height:100%;object-fit:cover}

/* statisztika */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0 14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 14px}
.stat b{display:block;font-size:22px;font-weight:800;letter-spacing:-.5px}
.stat span{font-size:12px;color:var(--mute)}
.stat.warn b{color:var(--orange)}

.search{position:relative;margin-bottom:12px}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);opacity:.5}
.search input{width:100%;background:var(--field);border:1px solid var(--line);border-radius:14px;padding:12px 14px 12px 40px;font-size:16px;outline:none}
.search input:focus{border-color:rgba(10,132,255,.6)}

.seg{display:flex;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:4px}
.seg button{flex:1;border:0;background:none;padding:9px 4px;border-radius:12px;font-size:14px;font-weight:600;color:var(--mute);transition:.2s}
.seg button.on{background:var(--grad);color:#fff;box-shadow:0 4px 14px rgba(10,132,255,.35)}
.seg small{opacity:.75;font-weight:500;margin-left:3px}

/* listák */
.list{display:flex;flex-direction:column;gap:10px;margin-top:6px}
.card{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:10px 12px 10px 10px;transition:transform .15s}
.card:active,.place:active{transform:scale(.98)}
.thumb{width:60px;height:60px;border-radius:14px;flex:none;overflow:hidden;display:grid;place-items:center;font-weight:800;font-size:20px;color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.35);background:var(--field)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.mid{flex:1;min-width:0}
.t{font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.path{color:var(--mute);font-size:13px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tags{display:flex;gap:6px;margin-top:7px;flex-wrap:wrap}
.tag{font-size:12px;font-weight:600;padding:3px 8px;border-radius:8px;background:var(--field);color:#c7c7d1}
.tag.lent{background:rgba(255,159,10,.16);color:var(--orange)}
.chev{color:var(--mute);font-size:24px;font-weight:300;flex:none;line-height:1}
.empty{text-align:center;padding:44px 20px;color:var(--mute)}
.empty>div:first-child{font-size:46px;margin-bottom:10px}
.hint{color:var(--mute);font-size:13px;line-height:1.45;margin:8px 0 0}
.sec{color:var(--mute);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;margin:20px 4px 4px}

.tagbar{display:flex;gap:8px;overflow-x:auto;padding:12px 0 4px;scrollbar-width:none}
.tagbar::-webkit-scrollbar{display:none}
.tagbar .chip{flex:none;padding:7px 12px;font-size:13px}

/* helyek */
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:2px;margin:12px 0 4px;font-size:14px}
.crumbs button{border:0;background:none;color:#64b0ff;font-weight:600;padding:5px 3px}
.crumbs button.cur{color:var(--text)}
.crumbs span{color:var(--mute)}
.here{display:flex;align-items:center;gap:12px;margin:6px 0 12px}
.here .ico{font-size:32px}
.here h3{margin:0;font-size:24px;font-weight:800;letter-spacing:-.4px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.edit{border:0;background:var(--field);border-radius:12px;padding:8px 12px;font-size:14px;font-weight:600;color:var(--mute)}
.place{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:11px 14px 11px 11px;transition:transform .15s}
.place .ico,.prow2 .ico{width:42px;height:42px;border-radius:12px;background:rgba(10,132,255,.14);display:grid;place-items:center;font-size:22px;flex:none}
.dash{width:100%;border:1.5px dashed rgba(255,255,255,.18);background:none;border-radius:16px;padding:13px;color:#64b0ff;font-weight:700;font-size:15px;margin-top:10px}
.quick{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:18px}

.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(22px + env(safe-area-inset-bottom));border:0;border-radius:30px;background:var(--grad);color:#fff;font-weight:700;font-size:16px;padding:15px 26px;box-shadow:0 10px 30px rgba(10,132,255,.45);display:flex;align-items:center;gap:8px;z-index:6;white-space:nowrap}
.fab span{font-size:22px;line-height:0}

/* lap (sheet) */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:none;align-items:flex-end;justify-content:center;z-index:10}
.sheet-bg.show{display:flex}
.sheet{background:#121218;border:1px solid var(--line);border-bottom:0;width:100%;max-width:680px;border-radius:26px 26px 0 0;padding:10px 18px calc(22px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto;animation:up .25s ease;-webkit-overflow-scrolling:touch}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.grab{width:40px;height:5px;border-radius:3px;background:rgba(255,255,255,.2);margin:0 auto 14px}
.shead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:8px}
.shead h2{margin:0;font-size:22px;font-weight:800;min-width:0;overflow-wrap:anywhere}
.x{border:0;background:var(--field);width:32px;height:32px;border-radius:50%;font-size:16px;color:var(--mute);flex:none}
label{display:block;color:var(--mute);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin:16px 0 7px}
.f{width:100%;background:var(--field);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:16px;outline:none}
.f:focus{border-color:rgba(10,132,255,.6)}
textarea.f{min-height:80px;resize:vertical}
.sel{display:flex;align-items:center;justify-content:space-between;gap:10px;text-align:left}
.sel span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sel.ph{color:var(--mute)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--field);border-radius:12px;padding:9px 14px;font-size:14px;font-weight:600;color:var(--mute)}
.chip.on{background:var(--grad);border-color:transparent;color:#fff}
.chips.icons .chip{font-size:22px;padding:6px 10px;line-height:1.2}
.addrow{display:flex;gap:8px}
.addrow .f{flex:1;min-width:0}
.addrow button{border:0;border-radius:14px;background:var(--grad);color:#fff;font-weight:700;padding:0 16px;flex:none}
.btn{width:100%;border:0;border-radius:16px;padding:15px;font-weight:700;font-size:16px;background:var(--grad);color:#fff;margin-top:22px;box-shadow:0 8px 24px rgba(10,132,255,.3)}
.btn:disabled{opacity:.6}
.btn.alt{background:var(--field);box-shadow:none}
.btn.del{background:rgba(255,69,58,.12);color:var(--red);box-shadow:none;margin-top:10px}
.btn.sm{margin-top:10px;padding:13px}
.btn2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* tárgy nézet */
.big{width:100%;max-height:50vh;min-height:120px;object-fit:contain;border-radius:18px;background:#000;display:block;margin:2px 0 4px}
.loc{display:flex;gap:12px;align-items:center;background:linear-gradient(135deg,rgba(10,132,255,.2),rgba(94,92,230,.2));border:1px solid rgba(10,132,255,.35);border-radius:18px;padding:14px;margin-top:10px;width:100%;text-align:left}
.loc .pin{font-size:28px;flex:none}
.loc small{display:block;color:#9fc7ff;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-bottom:2px}
.loc b{font-size:17px;line-height:1.35}
.lentbox{display:flex;align-items:center;justify-content:space-between;gap:10px;background:rgba(255,159,10,.12);border:1px solid rgba(255,159,10,.3);color:var(--orange);border-radius:16px;padding:10px 10px 10px 14px;margin-top:10px;font-weight:600}
.lentbox button{border:0;border-radius:12px;background:rgba(255,159,10,.22);color:var(--orange);font-weight:700;padding:9px 12px;font-size:13px;flex:none}
.note{white-space:pre-wrap;line-height:1.45;background:var(--field);border-radius:14px;padding:12px 14px;margin-top:10px;font-size:15px}
.meta{color:var(--mute);font-size:13px;margin-top:12px}

/* fotó választó */
.pbox{width:100%;aspect-ratio:4/3;border-radius:18px;border:1.5px dashed rgba(255,255,255,.2);background:var(--field);display:grid;place-items:center;color:var(--mute);font-weight:600;overflow:hidden;padding:0}
.pbox img{width:100%;height:100%;object-fit:cover;display:block}
.pbox span{display:block;font-size:42px;margin-bottom:6px}
.prow{display:flex;gap:8px;margin-top:8px}
.prow button{flex:1;border:0;border-radius:12px;background:var(--field);padding:10px;font-weight:600;font-size:14px;color:var(--mute)}

/* helyválasztó */
.prow2{display:flex;align-items:stretch;background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.prow2.on{border-color:rgba(10,132,255,.7);background:rgba(10,132,255,.1)}
.prow2 .pick{flex:1;display:flex;align-items:center;gap:12px;border:0;background:none;padding:10px 12px;text-align:left;min-width:0}
.prow2 .pick .n{font-size:16px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow2 .pick small{display:block;color:var(--mute);font-size:12px;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow2 .in{border:0;border-left:1px solid var(--line);background:rgba(255,255,255,.03);min-width:58px;color:#64b0ff;font-size:14px;font-weight:700;flex:none}

/* belépés */
.login{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
.login img{width:110px;height:110px;border-radius:26px;box-shadow:0 20px 50px rgba(10,132,255,.4);margin-bottom:24px}
.login h1{font-size:32px}
.login p{color:var(--mute);margin:8px 0 30px;max-width:300px;line-height:1.45}
.gbtn{display:flex;align-items:center;gap:10px;border:0;border-radius:16px;background:#fff;color:#111;font-weight:700;font-size:16px;padding:14px 24px}

.toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top));transform:translateX(-50%);background:rgba(40,40,48,.95);backdrop-filter:blur(10px);border:1px solid var(--line);padding:11px 18px;border-radius:22px;font-size:14px;display:none;z-index:20;max-width:90vw;text-align:center}
</style>
</head>
<body>

<script>
// NetguY Hol van? – V1.0
// === Beállítás ===
const SUPABASE_URL = "https://rfjegxblgadmnrosxreb.supabase.co";
const SUPABASE_KEY = "sb_publishable_hLRz7AvzmJFyvqHMqOTDoA_MTWBRwzT";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const BUCKET = "holvan-photos";
const T_ITEMS = "holvan_items", T_PLACES = "holvan_places";

const ICONS = ["🏠","🛏️","🛋️","🍳","🛁","🚪","🪜","🏚️","🚗","🗄️","📦","🧰","🧺","👕","📚","🔌","💼","🎄"];
const ROOMS = [["🛏️","Hálószoba"],["🛋️","Nappali"],["🍳","Konyha"],["🛁","Fürdőszoba"],["🚪","Előszoba"],["🏚️","Pince"],["🪜","Padlás"],["🚗","Garázs"]];
const SEARCH_SVG = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>';
const GOOGLE_SVG = '<svg width="20" height="20" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="m6.3 14.7 6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>';

let session = null, places = [], items = [], loaded = false, lastLoad = 0;
let tab = "items", q = "", cur = null, tagF = null;
const urls = new Map(); let signedAt = 0;

// === Segédfüggvények ===
const $ = (s) => document.querySelector(s);
function h(tag, attrs, ...kids){
  const e = document.createElement(tag);
  for (const [k,v] of Object.entries(attrs||{})){
    if (k==="class") e.className=v;
    else if (k==="html") e.innerHTML=v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (v!==false && v!=null) e.setAttribute(k, v===true?"":v);
  }
  for (const k of kids.flat()) if (k!=null && k!==false) e.append(k.nodeType?k:document.createTextNode(k));
  return e;
}
let toastT; function toast(msg){const t=$("#toast");t.textContent=msg;t.style.display="block";clearTimeout(toastT);toastT=setTimeout(()=>t.style.display="none",2400)}
const cmp = (a,b) => a.name.localeCompare(b.name,"hu",{sensitivity:"base"});
const norm = (s) => (s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
const words = (s) => norm(s).split(/\s+/).filter(Boolean);
function hue(s){let x=0;for(const c of s)x=(x*31+c.charCodeAt(0))>>>0;return x%360}
function grad(t){const a=hue(t),b=(a+50)%360;return `background:linear-gradient(150deg,hsl(${a} 70% 52%),hsl(${b} 65% 32%))`}
function initials(t){const w=t.trim().split(/\s+/).filter(Boolean);return ((w[0]||"?")[0]+(w[1]?w[1][0]:"")).toUpperCase()}
const fmtDate = (d) => new Date(d).toLocaleDateString("hu-HU",{year:"numeric",month:"short",day:"numeric"});

// helyek fája
const byId = (id) => id ? places.find(p=>p.id===id) : null;
const icoOf = (p) => p.icon || (p.parent_id ? "📦" : "🏠");
function pathOf(id){const out=[],seen=new Set();let p=byId(id);while(p&&!seen.has(p.id)){seen.add(p.id);out.unshift(p);p=byId(p.parent_id)}return out}
const pathText = (id) => pathOf(id).map(p=>p.name).join(" › ");
const kids = (pid) => places.filter(p=>(p.parent_id||null)===(pid||null)).sort(cmp);
function under(id){const s=new Set([id]);let grew=true;while(grew){grew=false;for(const p of places)if(p.parent_id&&s.has(p.parent_id)&&!s.has(p.id)){s.add(p.id);grew=true}}return s}
function deep(id){const s=under(id);return {places:s.size-1,items:items.filter(x=>s.has(x.place_id)).length}}
const countText = (c) => [c.places?c.places+" hely":null, c.items+" tárgy"].filter(Boolean).join(" · ");
const itemText = (x) => norm([x.name,(x.tags||[]).join(" "),x.notes,x.lent_to,pathText(x.place_id)].join(" "));

// === Fotók (privát tároló, aláírt linkek) ===
const thumbOf = (p) => p ? p.replace(/\.jpg$/,"_t.jpg") : null;
const signQ = new Set(); let signT;
function img(path, cls){
  const e = h("img",{class:cls||"",alt:"","data-path":path});
  const u = urls.get(path); if (u) e.src=u; else { signQ.add(path); clearTimeout(signT); signT=setTimeout(flushSign,30); }
  return e;
}
async function flushSign(){
  const need=[...signQ].filter(p=>!urls.has(p)); signQ.clear(); if(!need.length) return;
  const { data, error } = await sb.storage.from(BUCKET).createSignedUrls(need, 60*60*24);
  if (error || !data) return;
  for (const r of data) if (r.signedUrl && !r.error) urls.set(r.path, r.signedUrl);
  document.querySelectorAll("img[data-path]").forEach(e=>{const u=urls.get(e.dataset.path);if(u&&e.getAttribute("src")!==u)e.src=u});
}
function readImg(file){
  return new Promise((ok,bad)=>{const u=URL.createObjectURL(file),im=new Image();
    im.onload=()=>{URL.revokeObjectURL(u);ok(im)}; im.onerror=()=>{URL.revokeObjectURL(u);bad(new Error("A képet nem sikerült beolvasni"))}; im.src=u;});
}
function toJpeg(im, max, quality){
  const s=Math.min(1,max/Math.max(im.naturalWidth,im.naturalHeight)), c=document.createElement("canvas");
  c.width=Math.max(1,Math.round(im.naturalWidth*s)); c.height=Math.max(1,Math.round(im.naturalHeight*s));
  c.getContext("2d").drawImage(im,0,0,c.width,c.height);
  return new Promise((ok,bad)=>c.toBlob(b=>b?ok(b):bad(new Error("Képtömörítési hiba")),"image/jpeg",quality));
}
async function uploadPhoto(file){
  const im = await readImg(file);
  const big = await toJpeg(im,1400,.82), small = await toJpeg(im,360,.75);
  const path = `${session.user.id}/${crypto.randomUUID()}.jpg`, t = thumbOf(path), st = sb.storage.from(BUCKET);
  const a = await st.upload(path,big,{contentType:"image/jpeg",cacheControl:"31536000"}); if (a.error) throw a.error;
  const b = await st.upload(t,small,{contentType:"image/jpeg",cacheControl:"31536000"}); if (b.error){ await st.remove([path]); throw b.error; }
  urls.set(path,URL.createObjectURL(big)); urls.set(t,URL.createObjectURL(small));
  return path;
}
async function dropPhoto(path){ if (path) await sb.storage.from(BUCKET).remove([path, thumbOf(path)]); }

// === Auth ===
async function login(){
  const { error } = await sb.auth.signInWithOAuth({provider:"google",options:{redirectTo:location.origin+location.pathname}});
  if (error) toast("Bejelentkezési hiba: "+error.message);
}
async function logout(){ if(confirm("Kijelentkezel?")) await sb.auth.signOut(); }

// === Adat ===
async function load(){
  const [p,i] = await Promise.all([sb.from(T_PLACES).select("*"), sb.from(T_ITEMS).select("*")]);
  const err = p.error || i.error; if (err){ toast("Betöltési hiba: "+err.message); return; }
  if (Date.now()-signedAt > 12*3600e3){ urls.clear(); signedAt=Date.now(); }
  places=p.data; items=i.data; loaded=true; lastLoad=Date.now();
  if (cur && !byId(cur)) cur=null;
  render();
}
async function save(table, id, patch){
  const res = id
    ? await sb.from(table).update(patch).eq("id", id).select().single()
    : await sb.from(table).insert(patch).select().single();
  if (res.error){ toast("Mentési hiba: "+res.error.message); return null; }
  const arr = table===T_ITEMS ? items : places;
  const k = arr.findIndex(x=>x.id===res.data.id); if (k>=0) arr[k]=res.data; else arr.push(res.data);
  return res.data;
}
async function del(table, id){
  const { error } = await sb.from(table).delete().eq("id", id);
  if (error){ toast("Törlési hiba: "+error.message); return false; }
  if (table===T_ITEMS) items=items.filter(x=>x.id!==id); else places=places.filter(x=>x.id!==id);
  return true;
}

function empty(ico, txt, ...more){ return h("div",{class:"empty"}, h("div",{},ico), h("div",{},txt), ...more); }

function renderList(){
  const box=$("#list"); if(!box) return; box.replaceChildren();
  if (!loaded){ box.append(empty("⏳","Betöltés…")); return; }
  const w = words(q);
  if (w.length){
    const it = items.filter(x=>{const t=itemText(x);return w.every(z=>t.includes(z))}).sort(cmp);
    const pl = places.filter(p=>{const t=norm(pathText(p.id));return w.every(z=>t.includes(z))}).sort(cmp);
    if (!it.length && !pl.length){ box.append(empty("🔍","Nincs találat.")); return; }
    if (it.length) box.append(h("div",{class:"sec"},"Tárgyak"), h("div",{class:"list"}, it.map(itemCard)));
    if (pl.length) box.append(h("div",{class:"sec"},"Helyek"), h("div",{class:"list"}, pl.map(p=>placeCard(p,true))));
    return;
  }
  if (tab==="items") renderItems(box); else renderPlaces(box);
}

function renderItems(box){
  if (!items.length){
    box.append(empty("📦","Még nincs egy tárgy sem.",
      h("p",{class:"hint"},"Nyomd meg az „Új tárgy” gombot, fotózd le, és add meg, hová tetted.")));
    return;
  }
  const tags=[...new Set(items.flatMap(x=>x.tags||[]))].sort((a,b)=>a.localeCompare(b,"hu"));
  const hasLent=items.some(x=>x.lent_to);
  if (tagF==="__lent" ? !hasLent : (tagF && !tags.includes(tagF))) tagF=null;
  const bar=[h("button",{class:"chip"+(!tagF?" on":""),onclick:()=>{tagF=null;renderList()}},"Mind")];
  if (hasLent) bar.push(h("button",{class:"chip"+(tagF==="__lent"?" on":""),onclick:()=>{tagF="__lent";renderList()}},"🤝 Kölcsönben"));
  for (const t of tags) bar.push(h("button",{class:"chip"+(tagF===t?" on":""),onclick:()=>{tagF=t;renderList()}},"#"+t));
  if (bar.length>1) box.append(h("div",{class:"tagbar"},bar));
  const rows=items.filter(x=>!tagF || (tagF==="__lent" ? x.lent_to : (x.tags||[]).includes(tagF))).sort(cmp);
  box.append(h("div",{class:"list"}, rows.map(itemCard)));
}

function itemCard(x){
  const t=thumbOf(x.photo_path), pth=pathText(x.place_id), tg=x.tags||[];

function placeCard(p, full){

function renderPlaces(box){
  if (cur && !byId(cur)) cur=null;
  if (!places.length){
    box.append(empty("🏠","Kezdd a szobákkal!",
      h("p",{class:"hint"},"Koppints rájuk, és felveszem őket. Utána mindegyikbe tehetsz szekrényt, polcot, dobozt."),
      h("div",{class:"quick"}, ROOMS.map(([i,n])=>h("button",{class:"chip",onclick:async e=>{
        e.currentTarget.disabled=true; e.currentTarget.classList.add("on");
        const r=await save(T_PLACES,null,{name:n,icon:i,parent_id:null}); if(r) toast(n+" hozzáadva");
      }},i+" "+n))),
      h("button",{class:"dash",style:"margin-top:18px",onclick:()=>openPlace(null,null)},"+ Saját hely"),
      h("button",{class:"btn sm",onclick:()=>render()},"Kész")));
    return;
  }
  const chain=pathOf(cur);
  const crumbs=[h("button",{class:cur?"":"cur",onclick:()=>{cur=null;renderList()}},"🏠 Összes")];
  chain.forEach((p,i)=>crumbs.push(h("span",{},"›"), h("button",{class:i===chain.length-1?"cur":"",onclick:()=>{cur=p.id;renderList()}},p.name)));
  box.append(h("div",{class:"crumbs"},crumbs));
  const here=byId(cur);
  if (here) box.append(h("div",{class:"here"}, h("span",{class:"ico"},icoOf(here)), h("h3",{},here.name),
    h("button",{class:"edit",onclick:()=>openPlace(here)},"Szerkesztés")));
  const ch=kids(cur), its=items.filter(x=>(x.place_id||null)===(cur||null)).sort(cmp);
  if (ch.length) box.append(h("div",{class:"list"}, ch.map(p=>placeCard(p,false))));
  box.append(h("button",{class:"dash",onclick:()=>openPlace(null,cur)}, here ? "+ Új hely ezen belül" : "+ Új szoba / hely"));
  if (its.length) box.append(h("div",{class:"sec"}, here ? "Itt van" : "Hely nélkül"), h("div",{class:"list"}, its.map(itemCard)));
  else if (here && !ch.length) box.append(empty("📭","Itt még nincs semmi."));
}

// helyválasztó (fában lépkedve vagy kereséssel)
function picker({title, current=null, exclude=new Set(), allowRoot=false, onPick, onBack}){
  let lvl = byId(current) ? (byId(current).parent_id||null) : null, s="";
  if (lvl && exclude.has(lvl)) lvl=null;
  function row(p, full){
    const n=kids(p.id).filter(c=>!exclude.has(c.id)).length;
    const sub = full && p.parent_id ? pathText(p.parent_id) : (p.id===current ? "Jelenleg itt" : "");
    return h("div",{class:"prow2"+(p.id===current?" on":"")},
      h("button",{class:"pick",onclick:()=>onPick(p.id)},
        h("span",{class:"ico"},icoOf(p)),
        h("div",{style:"min-width:0"}, h("div",{class:"n"},p.name), sub ? h("small",{},sub) : null)),
      n ? h("button",{class:"in",title:"Belépés",onclick:()=>{lvl=p.id;s="";sh.querySelector("#psearch").value="";drawList()}}, n+" ›") : null);
  }
  async function add(){
    const inp=sh.querySelector("#newp"), n=inp.value.trim();
    if (!n){ toast("Írd be a hely nevét"); inp.focus(); return; }
    inp.disabled=true;
    const r=await save(T_PLACES,null,{name:n,parent_id:lvl,icon:null});
    inp.disabled=false;
    if (r){ render(); onPick(r.id); }
  }
  function drawList(){
    const box=sh.querySelector("#plist"); box.replaceChildren();
    const w=words(s);
    if (w.length){
      const res=places.filter(p=>!exclude.has(p.id) && (t=>w.every(z=>t.includes(z)))(norm(pathText(p.id))))
        .sort((a,b)=>pathText(a.id).localeCompare(pathText(b.id),"hu"));
      box.append(res.length ? h("div",{class:"list"}, res.map(p=>row(p,true))) : h("p",{class:"hint"},"Nincs ilyen hely. Töröld a keresést, és vedd fel új helyként."));
      return;
    }
    const chain=pathOf(lvl), here=byId(lvl);
    const crumbs=[h("button",{class:lvl?"":"cur",onclick:()=>{lvl=null;drawList()}},"🏠 Összes")];
    chain.forEach((p,i)=>crumbs.push(h("span",{},"›"), h("button",{class:i===chain.length-1?"cur":"",onclick:()=>{lvl=p.id;drawList()}},p.name)));
    box.append(h("div",{class:"crumbs"},crumbs));
    if (here) box.append(h("button",{class:"btn sm",onclick:()=>onPick(lvl)},"Ide: "+here.name));
    else if (allowRoot) box.append(h("button",{class:"btn sm",onclick:()=>onPick(null)},"Legfelső szintre"));
    const ch=kids(lvl).filter(p=>!exclude.has(p.id));
    box.append(ch.length ? h("div",{class:"list",style:"margin-top:12px"}, ch.map(p=>row(p,false)))
      : h("p",{class:"hint"}, here ? "Ezen belül még nincs kisebb hely." : "Még nincs egy hely sem. Vedd fel az elsőt lent."));
    box.append(
      h("label",{}, here ? "Új hely ezen belül: "+here.name : "Új szoba / hely"),
      h("div",{class:"addrow"},
        h("input",{class:"f",id:"newp",maxlength:80,enterkeyhint:"done",placeholder:here?"pl. Felső polc, Kék doboz":"pl. Hálószoba",onkeydown:e=>{if(e.key==="Enter"){e.preventDefault();add()}}}),
        h("button",{onclick:add},"Hozzáad")));
  }
  sh.replaceChildren(...head(title, onBack),
    h("div",{class:"search",html:SEARCH_SVG}, h("input",{id:"psearch",type:"search",placeholder:"Hely keresése…",oninput:e=>{s=e.target.value;drawList()}})),
    h("div",{id:"plist"}));
  drawList(); showSheet();
}

// tárgy felvétele / szerkesztése
function openEdit(x, preset=null){
  const d = x ? {...x, tags:[...(x.tags||[])]} : {name:"",place_id:preset||null,tags:[],notes:"",lent_to:"",photo_path:null};
  let file=null, preview=null, dropOld=false, busy=false, newTag="";
  const fileIn=h("input",{type:"file",accept:"image/*",style:"display:none",onchange:e=>{
    const f=e.target.files[0]; if(!f) return; file=f; dropOld=false;
    if (preview) URL.revokeObjectURL(preview); preview=URL.createObjectURL(f); redraw();
  }});
  const pickPhoto = () => { fileIn.value=""; fileIn.click(); };
  function addTag(v){ v=(v||"").trim().toLowerCase().replace(/^#+/,"").replace(/,/g,"").slice(0,30); if(v && !d.tags.includes(v)) d.tags.push(v); }
  function redraw(){
    const hasPhoto = !!preview || (!!d.photo_path && !dropOld);
    const other=[...new Set(items.flatMap(i=>i.tags||[]))].filter(t=>!d.tags.includes(t)).sort((a,b)=>a.localeCompare(b,"hu"));
    sh.replaceChildren(...[
      ...head(x ? "Szerkesztés" : "Új tárgy", x ? ()=>openItem(x.id) : null),
      fileIn,
      h("button",{class:"pbox",type:"button",onclick:pickPhoto},
        preview ? h("img",{src:preview,alt:""}) : (hasPhoto ? img(d.photo_path) : h("div",{}, h("span",{},"📷"), "Fotó hozzáadása"))),
      hasPhoto ? h("div",{class:"prow"},
        h("button",{onclick:pickPhoto},"Fotó cseréje"),
        h("button",{onclick:()=>{ if(preview) URL.revokeObjectURL(preview); preview=null; file=null; dropOld=!!d.photo_path; redraw(); }},"Fotó törlése")) : null,
      h("label",{},"Megnevezés"),
      h("input",{class:"f",id:"iname",value:d.name,maxlength:120,placeholder:"pl. Útlevél, HDMI kábel, Fúrógép",oninput:e=>d.name=e.target.value}),
      h("label",{},"Hol van?"),
      h("button",{class:"f sel"+(d.place_id?"":" ph"),onclick:()=>picker({title:"Hová tetted?",current:d.place_id,onBack:redraw,onPick:id=>{d.place_id=id;redraw()}})},
        h("span",{}, d.place_id ? "📍 "+pathText(d.place_id) : "Válassz helyet…"), h("span",{class:"chev"},"›")),
      h("label",{},"Címkék"),
      d.tags.length ? h("div",{class:"chips",style:"margin-bottom:8px"}, d.tags.map(t=>h("button",{type:"button",class:"chip on",onclick:()=>{d.tags=d.tags.filter(z=>z!==t);redraw()}},"#"+t+" ✕"))) : null,
      h("div",{class:"addrow"},
        h("input",{class:"f",id:"itag",maxlength:30,enterkeyhint:"done",placeholder:"Új címke, pl. papírok",value:newTag,oninput:e=>newTag=e.target.value,
          onkeydown:e=>{if(e.key==="Enter"||e.key===","){e.preventDefault();addTag(newTag);newTag="";redraw();sh.querySelector("#itag").focus()}}}),
        h("button",{onclick:()=>{addTag(newTag);newTag="";redraw()}},"+")),
      other.length ? h("div",{class:"chips",style:"margin-top:8px"}, other.map(t=>h("button",{type:"button",class:"chip",onclick:()=>{d.tags.push(t);redraw()}},"#"+t))) : null,
      h("label",{},"Kölcsönadva (kinek?)"),
      h("input",{class:"f",value:d.lent_to||"",maxlength:80,placeholder:"Üresen hagyva: otthon van",oninput:e=>d.lent_to=e.target.value}),
      h("label",{},"Megjegyzés"),
      h("textarea",{class:"f",maxlength:1000,placeholder:"pl. a kék mappában, a garancialevéllel együtt",oninput:e=>d.notes=e.target.value}, d.notes||""),
      h("button",{class:"btn",id:"isave",onclick:submit},"Mentés"),
      x ? h("button",{class:"btn del",onclick:async()=>{
        if(!confirm("Biztosan törlöd ezt a tárgyat?")) return;
        if(await del(T_ITEMS,x.id)){ dropPhoto(x.photo_path); closeSheet(); render(); toast("Törölve"); }
      }},"Törlés") : null
    ].filter(Boolean));
  }
  async function submit(){
    if (busy) return;
    if (newTag.trim()){ addTag(newTag); newTag=""; }
    const name=d.name.trim(); if(!name){ toast("A megnevezés kötelező"); return; }
    busy=true; const b=sh.querySelector("#isave"); b.disabled=true; b.textContent = file ? "Fotó feltöltése…" : "Mentés…";
    let uploaded=null;
    try{
      let photo = dropOld ? null : (d.photo_path||null);
      if (file){ uploaded=await uploadPhoto(file); photo=uploaded; }
      const patch={name, place_id:d.place_id||null, tags:d.tags, notes:(d.notes||"").trim()||null, lent_to:(d.lent_to||"").trim()||null, photo_path:photo};
      if (!x || (x.place_id||null)!==(d.place_id||null)) patch.moved_at=new Date().toISOString();
      const r=await save(T_ITEMS, x?x.id:null, patch);
      if (!r){ if (uploaded) dropPhoto(uploaded); return; }
      if (x && x.photo_path && x.photo_path!==photo) dropPhoto(x.photo_path);
      if (preview) URL.revokeObjectURL(preview);
      render(); openItem(r.id); toast(x ? "Mentve" : "Elmentve");
    } catch(e){
      if (uploaded) dropPhoto(uploaded);
      toast("Hiba: "+(e.message||e));
    } finally {
      busy=false; const b2=sh.querySelector("#isave"); if(b2){ b2.disabled=false; b2.textContent="Mentés"; }
    }
  }
  redraw(); showSheet();
}

    ].filter(Boolean));

// === Indítás ===
function boot(s){
  const prev = session && session.user.id; session = s;
  if (s){ if (prev!==s.user.id || !loaded){ render(); load(); } }
  else { items=[]; places=[]; loaded=false; urls.clear(); render(); }
}
sb.auth.onAuthStateChange((_ev, s)=>boot(s));
sb.auth.getSession().then(({data})=>boot(data.session));
document.addEventListener("visibilitychange",()=>{
  if (document.visibilityState==="visible" && session && loaded && Date.now()-lastLoad>3*60e3 && !bg.classList.contains("show")) load();
});
</script>
</body>
</html>
